name: Fork release

# Builds the fork for 64-bit Windows on every push to `release`, and
# publishes an MSI installer to a rolling `fork-latest` release. Install or
# update via the installer or `resources/scripts/update-fork.ps1`.
#
# Builds have UIAccess enabled (to manage elevated windows), which requires
# them to be signed by a trusted certificate. They are signed with the
# certificate created by `resources/scripts/new-fork-signing-cert.ps1`, via
# the `FORK_SIGNING_PFX_BASE64` and `FORK_SIGNING_PFX_PASSWORD` secrets.
# The installer adds the certificate to the machine's Trusted Root store.
on:
  push:
    branches: [release]

permissions:
  contents: write

concurrency:
  group: fork-release
  cancel-in-progress: true

env:
  RELEASE_TAG: fork-latest
  TARGET: x86_64-pc-windows-msvc
  # Each build is versioned higher than the last, such that the installer
  # upgrades previous fork and official installations.
  VERSION_NUMBER: 3.10.${{ github.run_number }}
  MSI_NAME: glazewm-fork-x64.msi

jobs:
  build-and-release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@21dc36fb71dd22e3317045c0c31a3f4249868b17
        with:
          targets: ${{ env.TARGET }}
          toolchain: nightly

      - uses: swatinem/rust-cache@f0deed1e0edfc6a9be95417288c0e1099b1eeec3
        with:
          shared-key: fork-${{ env.TARGET }}-${{ hashFiles('Cargo.lock') }}

      - name: Build
        shell: bash
        run: |
          cargo build --locked --release --target "$TARGET" --workspace \
            --features wm/ui_access

      - name: Test
        shell: bash
        run: cargo test --locked --release --target "$TARGET" -p wm

      # UIAccess executables fail to start unless signed, so signing is
      # required.
      - name: Sign executables
        shell: pwsh
        env:
          FORK_SIGNING_PFX_BASE64: ${{ secrets.FORK_SIGNING_PFX_BASE64 }}
          FORK_SIGNING_PFX_PASSWORD: ${{ secrets.FORK_SIGNING_PFX_PASSWORD }}
        run: |
          $releaseDir = "target/$env:TARGET/release"
          ./resources/scripts/sign-fork-files.ps1 `
            "$releaseDir/glazewm.exe" `
            "$releaseDir/glazewm-cli.exe" `
            "$releaseDir/glazewm-watcher.exe"

      - name: Install WiX
        shell: pwsh
        run: |
          dotnet tool install --global wix --version 5.0.0
          wix extension add -g WixToolset.UI.wixext/5 `
            WixToolset.Util.wixext/5 WixToolset.Iis.wixext/5

      - name: Build installer
        shell: pwsh
        run: |
          $exeDir = 'out/x64'
          New-Item -ItemType Directory -Force -Path $exeDir | Out-Null

          'glazewm.exe', 'glazewm-cli.exe', 'glazewm-watcher.exe' |
            ForEach-Object {
              Copy-Item "target/$env:TARGET/release/$_" $exeDir
            }

          wix build -arch x64 `
            -ext WixToolset.UI.wixext `
            -ext WixToolset.Util.wixext `
            -ext WixToolset.Iis.wixext `
            -out "out/$env:MSI_NAME" `
            ./resources/wix/standalone.wxs `
            ./resources/wix/standalone-ui.wxs `
            ./resources/wix/fork.wxs `
            -d VERSION_NUMBER="$env:VERSION_NUMBER" `
            -d EXE_DIR="$exeDir" `
            -d FORK=1 `
            -d FORK_COMMIT="$env:GITHUB_SHA" `
            -d MANUFACTURER='vladkosarev (GlazeWM fork)'

          if ($LASTEXITCODE -ne 0) {
            throw "wix build failed with exit code $LASTEXITCODE."
          }

      - name: Sign installer
        shell: pwsh
        env:
          FORK_SIGNING_PFX_BASE64: ${{ secrets.FORK_SIGNING_PFX_BASE64 }}
          FORK_SIGNING_PFX_PASSWORD: ${{ secrets.FORK_SIGNING_PFX_PASSWORD }}
        run: ./resources/scripts/sign-fork-files.ps1 "out/$env:MSI_NAME"

      # Builds and publishes in a single job to avoid storing artifacts.
      - name: Publish release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ASSETS_DIR="release-assets"
          mkdir -p "$ASSETS_DIR"
          cp "out/$MSI_NAME" resources/fork-signing.cer "$ASSETS_DIR/"

          # Commit the release was built from, used by the update script to
          # check whether an update is available.
          echo "$GITHUB_SHA" > "$ASSETS_DIR/commit.txt"

          gh release delete "$RELEASE_TAG" --yes --cleanup-tag || true

          gh release create "$RELEASE_TAG" "$ASSETS_DIR"/* \
            --target "$GITHUB_SHA" \
            --title "Fork build $VERSION_NUMBER (${GITHUB_SHA::7})" \
            --notes "Built from ${GITHUB_SHA} on \`${GITHUB_REF_NAME}\`. Run \`$MSI_NAME\` to install or update, or use \`resources/scripts/update-fork.ps1\`."
